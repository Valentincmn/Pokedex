<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Attrapez-les tous !</title>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header class="header">
        <h1>Pokédex</h1>
        <p class="subtitle">Attrapez-les tous, c'est notre histoire !</p>
    </header>

    <main class="main">
        <section class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Rechercher un Pokémon...">
                <button id="clear-search" class="clear-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="stats">
                <span id="pokemon-count">Chargement...</span>
            </div>
        </section>



        <section class="pokedex" id="pokedex">
            <!-- Les cartes Pokémon seront générées ici -->
        </section>

        <div class="no-results" id="no-results">
            <i class="fas fa-search"></i>
            <h3>Aucun Pokémon trouvé</h3>
            <p>Essayez de modifier votre recherche</p>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2024 Pokédex - Fait avec <i class="fas fa-heart"></i> pour les dresseurs</p>
    </footer>
</body>

</html>
